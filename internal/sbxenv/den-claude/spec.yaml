schemaVersion: "2"
kind: sandbox
name: den-claude
version: 1.0.0
description: >-
  den's Claude agent: no credentials block, so sbx keeps the Authorization header and the
  subscription OAuth token works (spike S3, option d). The image provides Claude Code.
sandbox:
  # den replaces this placeholder with the template's image pinned by digest, or the image the nest
  # names. sbx runs the image's ENTRYPOINT as PID 1 (the kit entrypoint only launches the agent):
  # docker.io/sbx/claude has ENTRYPOINT [claude], which exits and stops the VM (S6e).
  image: set-by-den
  entrypoint: ["claude", "--dangerously-skip-permissions"]
permissions:
  network:
    allow:
      # With its port: a bare host opens every port of that host to the VM.
      - api.anthropic.com:443
environment:
  variables:
    # Claude Code's own switch, undocumented: no trust dialog, and a project's .claude/settings*.json
    # hooks load without asking. The VM is the boundary. It does not record trust: Claude 2.1.330
    # still ignores a project's permissions.additionalDirectories without a trust entry, which the
    # startup step writes per folder. A single projects["/"] entry would not do: Claude stops its walk
    # up at the git root. den drops this block when the nest's auto_trust is false.
    CLAUDE_CODE_SANDBOXED: "1"
setup:
  # The theme wizard reads hasCompletedOnboarding in ~/.claude.json, which the image ships with its own
  # keys (autoUpdates, installMethod); the bypass-mode warning reads only settings files, never an
  # environment variable. Merge each key into the file, never overwrite it. Runs after the profile kits'
  # files/home/ copy, at every start. No jq is a loud failure, not a silent skip.
  # A kit ships settings defaults as ~/.den/claude-settings.d/*.json, never as settings.json itself: two
  # kits shipping the same file means the later one replaces it whole, and a template's defaults would
  # vanish under a personal kit. Fragments merge in name order, a later one wins, and a key already in
  # settings.json keeps its value.
  # ~/.den/trust.json lists each mounted repo and the start folder, or nothing when auto_trust is
  # false; each gets a trust entry in ~/.claude.json, the one Claude itself writes when the dialog is
  # accepted.
  startup:
    - command:
        - sh
        - -c
        - |
          set -eu
          umask 077
          command -v jq >/dev/null 2>&1 || { echo "den-claude: the image has no jq; den needs it to pre-accept Claude's first-run screens: add jq to the template" >&2; exit 1; }
          h="${HOME:-/home/agent}"
          merge() {
            file="$1"
            shift
            mkdir -p "$(dirname "$file")"
            # A whitespace-only file counts as missing: jq would print nothing and empty the file.
            { if grep -q '[^[:space:]]' "$file" 2>/dev/null; then cat "$file"; else echo '{}'; fi; } | jq "$@" > "$file.den-tmp" ||
              { rm -f "$file.den-tmp"; echo "den-claude: $file is not a JSON object: fix it, then start the VM again" >&2; exit 1; }
            mv "$file.den-tmp" "$file"
          }
          merge "$h/.claude.json" '.hasCompletedOnboarding = true'
          merge "$h/.claude/settings.json" '.skipDangerousModePermissionPrompt = true'
          trusted=$(jq -ce 'if type == "array" then . else error("not an array") end' "$h/.den/trust.json") ||
            { echo "den-claude: $h/.den/trust.json is missing or not a JSON array: den writes it at create; run den rm, then den up" >&2; exit 1; }
          merge "$h/.claude.json" --argjson trusted "$trusted" 'reduce $trusted[] as $p (.; .projects[$p].hasTrustDialogAccepted = true)'
          set -- "$h/.den/claude-settings.d"/*.json
          if [ -e "$1" ]; then
            for f; do
              jq -e 'type == "object"' "$f" >/dev/null 2>&1 ||
                { echo "den-claude: $f is not a JSON object: fix the kit that ships it, then start the VM again" >&2; exit 1; }
            done
            defaults=$(jq -s 'reduce .[] as $x ({}; . * $x)' "$@")
            merge "$h/.claude/settings.json" --argjson defaults "$defaults" '$defaults * .'
          fi
