# This is a den home: the nest, stack and agent below are placeholders — adapt them to your setup.
agents:
  claude:
    env: { CLAUDE_CONFIG_DIR: "{config_dir}" }
    # IN-VM paths added to PATH before the update command (cf. spec §9.1).
    bin_dirs: ["$HOME/.local/bin", "$HOME/.claude/local"]
    update: "claude update"
defaults:
  agent: claude
  stack: devx
ssh:
  mode: agent-forward
  dir: ~/.ssh_sbx
worktree_layout: central
egress:
  - api.anthropic.com
  - github.com
  - registry.npmjs.org
