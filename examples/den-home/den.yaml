schema: 1

repos:
  demo: ~/src/demo

network:
  allow:
    - api.anthropic.com

bases:
  example:
    image: example:v2
    build:
      steps: []

nests:
  demo:
    base: example
    profile: perso
    repos:
      - key: demo
      - path: ~/src/demo-docs
        optional: true
    ports:
      - {name: web, sandbox: 3000, host: 0}
    start: demo
