# The same three gates a local dev runs (`task check`), on every push and PR,
# plus the two build asserts the suite structurally cannot make.
# The `checks` job is hermetic by construction — no socket, no real sbx — so a
# bare ubuntu runner with a Go toolchain is enough; anything more (services, sbx
# install) would contradict the repo's own test conventions. It does now run the
# binary it just built, which the earlier "no process" wording forbade. That
# costs the job none of its hermeticity: `Execute` installs a signal handler and
# builds the command tree, and `den version` is a `fmt.Fprintf` over
# `displayVersion()` (`internal/cli/root.go:129`), which reads `runtime/debug`
# build info and nothing else — no socket, no fork, no den-home. The adjacent
# guard is `internal/ports/hermeticity_test.go`, which locks `internal/cli`
# against importing `net`, `hash/fnv` or `os/exec` at all; it was written for
# port decisions, but it is why this path has no raw system access to reach.
# `install-script` remains the one
# deliberate exception on the stronger claim: its object under test is the
# network path itself, so it gets a socket on purpose.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # `version` is pinned to the v3 line and not left to float: the action
      # otherwise installs whatever is newest, and a task v4 released on a
      # Tuesday would break a CI whose code has not moved. `repo-token` is what
      # keeps the release lookup off the unauthenticated GitHub API rate limit.
      #
      # The action's own major is `@v3` — unrelated to the `version: 3.x` below,
      # which is go-task's. v2.0.0 is the last node20 tag and was the one action
      # still tripping the deprecation warning after #44 bumped the other three;
      # v3.0.0 (2026-06-30) moves the runtime to node24 and changes nothing else
      # that matters here — `version` and `repo-token` are declared identically
      # at both tags, read out of action.yml, not out of the release notes.
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task check
      # `task check` green does not prove that `-X …/internal/cli.Version=` ever
      # reached the linker, and no Go test can: a test observes the binary it was
      # compiled into, never the one the Taskfile builds. These two steps are the
      # only place that proof can live, which is why they sit in CI rather than in
      # `internal/cli`. `TestResolveVersionKeepsDevWhenLdflagsStampedNothing`
      # covers the arbitration; it says nothing about what the build stamped.
      #
      # The assert is AGREEMENT with `git describe`, not "is it `dev`?". The live
      # failure mode is a misspelled `{{.VERSION}}`: Task renders an unknown
      # variable as the empty string, reports no error and exits 0, so
      # `…cli.Version=` reaches the linker with nothing after it. The binary does
      # NOT then answer `den ` — `resolveVersion` rescues an empty stamp back to
      # `dev` (`internal/cli/version.go:29`, covered by
      # `TestResolveVersionKeepsDevWhenLdflagsStampedNothing`), so a release built
      # through a typo'd Taskfile says exactly what a build that skipped the
      # runner says. Measured locally on a dirty tree, 2026-08-07, by stamping an
      # empty Version: the binary answered `den dev` and this step red with
      # `den version answered 'den dev', expected '<the describe output>'`.
      # Agreement is what separates the two, and it also catches the case a
      # `!= dev` test never could — a stamp that ran but named the wrong thing.
      #
      # The assert needs no assumption about what the runner's checkout fetched.
      # `task build` and the line below call the same `git describe` in the same
      # checkout, so whichever answer that checkout can produce — a tag, the
      # short SHA from `--always` when no tag was fetched, `-dirty` or not — both
      # sides read the same one. Symmetric under every outcome, and none of those
      # outcomes is a value the broken build can produce.
      - name: the stamped build agrees with git describe
        run: |
          task build
          want="den $(git describe --tags --always --dirty)"
          got="$(./den version)"
          if [ "$got" != "$want" ]; then
            echo "den version answered '$got', expected '$want'"
            exit 1
          fi
      # The other half: a build that skipped the runner must name nothing. This
      # guards the documented tell, and it is not hypothetical — it would have
      # caught the Go 1.24 regression #43 fixed, roughly three toolchain releases
      # before a human noticed it. Go started stamping `Main.Version` from VCS
      # state, `resolveVersion` accepted the resulting pseudo-version as a real
      # answer, and a plain `go build` quietly stopped saying `dev`. The unit
      # suite never saw it: it asserts on `(devel)`, the placeholder Go emits only
      # when there is no `.git` to read — which a checkout always has. Measured
      # 2026-08-07 on the same shallow tagless clone: `den dev`, so the depth-1
      # runner reaches the `fromLocalVCS` branch and not the build-info rescue.
      - name: a plain go build still answers dev
        run: |
          go build -o "$RUNNER_TEMP/den-plain" ./cmd/den
          got="$("$RUNNER_TEMP/den-plain" version)"
          if [ "$got" != "den dev" ]; then
            echo "a plain go build answered '$got', expected 'den dev'"
            exit 1
          fi

  # install.sh is an interface between .goreleaser.yaml's archive naming and
  # whatever machine runs `curl | sh`. shellcheck locks the POSIX-sh promise;
  # the smoke run against the real latest release is the only guard on the
  # archive-name contract — nothing else tests it. This job is also the one
  # deliberate exception to "no network in the suite": the thing under test
  # IS the network path.
  #
  # Two known spurious-failure vectors, so a red run here is not automatically a
  # regression: (a) /releases/latest can redirect to a new tag while its assets
  # are still uploading, which 404s the smoke's download — re-run the job;
  # (b) shellcheck ships with ubuntu-latest, so its version floats and a new
  # release can raise a check that passed yesterday on unchanged code.
  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck install.sh
      - name: smoke against the latest release
        run: |
          # The tag is resolved on both sides of the install so a release
          # landing mid-run cannot fail the assert: install.sh's own
          # resolution happens between these two, so its answer must match
          # one of them. The run stays unpinned on purpose — it is the only
          # coverage of the script's latest-tag branch (redirect parsing and
          # the v* check), which a DEN_VERSION pin would skip entirely.
          before=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/PillowPillow/den/releases/latest)
          before="${before##*/}"
          DEN_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          after=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/PillowPillow/den/releases/latest)
          after="${after##*/}"
          got=$("$RUNNER_TEMP/bin/den" version)
          if [ "$got" != "den $before" ] && [ "$got" != "den $after" ]; then
            echo "den version answered '$got', expected 'den $before' or 'den $after'"
            exit 1
          fi
      # The smoke above only proves the happy path. install.sh's whole stance is
      # fail-closed — refuse an unresolvable tag, a checksum mismatch, an
      # unverifiable binary — and nothing else in the repo exercises that side,
      # so a refusal silently degrading into a partial install would ship. This
      # step is that guard: the script must exit non-zero AND leave nothing
      # behind on the destination.
      - name: refusal paths
        run: |
          if DEN_INSTALL_DIR="$RUNNER_TEMP/neg" DEN_VERSION=v9.9.9 sh install.sh; then
            echo "expected a refusal for a nonexistent tag"; exit 1
          fi
          test ! -e "$RUNNER_TEMP/neg/den"
