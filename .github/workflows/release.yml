# Pushing a v* tag is the release trigger. The test job re-runs the same gates
# as ci.yml on the tagged commit — a tag can land on a commit that never went
# through a PR, and goreleaser must not ship what the suite has not vouched for.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task check

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser derives the changelog from git history and refuses a
          # shallow clone; fetch-depth 0 is its documented requirement.
          fetch-depth: 0
      # checkout fetches the annotated tag object, then re-fetches the commit SHA
      # *into the same ref* (`+<sha>:refs/tags/vX.Y.Z`), which downgrades the tag to a
      # lightweight one. `%(contents:body)` then answers nothing, so goreleaser's
      # `release.header: {{ .TagBody }}` publishes an empty release page — measured on
      # v1.1.0 (2026-08-04), whose body came out 4 bytes and had to be repaired by hand.
      # --force is not optional: without it this fetch refuses to clobber the lightweight
      # ref checkout just wrote, and nothing changes.
      - run: git fetch --force --tags
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
