# Pushing a `v*` tag is the release trigger. The `test` job below calls
# `gates.yml` on the tagged commit, so the tag faces the same gates `ci.yml`
# runs on every pull request. It has to: a tag can land on a commit that never
# went through a PR, and goreleaser must not ship what those gates have not
# vouched for.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/gates.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # NOT for the changelog, whatever this line said before. That pipe is
          # off — `.goreleaser.yaml:64` sets `disable: true`, because the release
          # body is the hand-written CHANGELOG.md section — so it never reads git
          # history at all. And goreleaser does not refuse a shallow clone: it
          # warns and carries on. Measured 2026-08-09, goreleaser 2.17.1, on a
          # `git clone --depth 1 --branch v1.4.0` of this repo running
          # `goreleaser release --skip=publish,announce --clean`: the log read
          # `running against a shallow clone - check your CI documentation`,
          # then built all four targets, wrote all four archives and ended
          # `release succeeded after 1s`. Neither half of the old rationale
          # survived checking.
          #
          # The depth stays, as defence rather than as a requirement. Nothing in
          # this job was ever measured WITHOUT it — the v1.1.0 tag-object
          # findings below were all observed with a full clone — and a release
          # runs rarely enough that fetching everything costs nobody anything.
          # Dropping it is a change that owes its own measurement, not a
          # cleanup somebody can take on this comment's word.
          fetch-depth: 0
      # checkout v4 fetched the annotated tag object, then re-fetched the commit SHA
      # *into the same ref* (`+<sha>:refs/tags/vX.Y.Z`), which downgraded the tag to a
      # lightweight one. `%(contents:body)` then answered nothing, so goreleaser's
      # `release.header: {{ .TagBody }}` published an empty release page — measured on
      # v1.1.0 (2026-08-04), whose body came out 4 bytes and had to be repaired by hand.
      # --force was not optional: without it this fetch refuses to clobber the lightweight
      # ref checkout just wrote, and nothing changes.
      #
      # checkout v7 fixes the cause (PR #2356, first shipped in v6.0.3): a tag ref now
      # fetches as `+refs/tags/vX.Y.Z:refs/tags/vX.Y.Z`, and the ref-match test derefs
      # with `^{commit}` instead of comparing a tag-object SHA against a commit SHA, so
      # the destructive second fetch is never reached. This step is therefore redundant
      # on v7 — it stays anyway. It costs a second and is idempotent, while the
      # regression it guards is invisible until the tag is already public and the
      # release page already wrong.
      - run: git fetch --force --tags
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
