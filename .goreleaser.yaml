# goreleaser is the release twin of `task build`: both exist to keep one promise,
# a shipped binary names the code it runs. The ldflags below MUST target the same
# symbol as the Taskfile (github.com/PillowPillow/den/internal/cli.Version) and
# use {{ .Tag }} — not {{ .Version }} — because `git describe` (the Taskfile
# path) answers `v1.0.0` with the leading v, and two install paths answering
# `v1.0.0` vs `1.0.0` for the same commit would look like two different builds
# in a bug report.
version: 2

project_name: den

# Pinned explicitly: goreleaser guesses the forge from ambient tokens, and a
# GITLAB_TOKEN in the developer's shell (common here) makes a local snapshot
# generate gitlab.com download URLs in the cask. The release lives on GitHub,
# token or no token in the environment.
release:
  github:
    owner: PillowPillow
    name: den
  # The release body is the curated CHANGELOG.md section, carried here in the annotated
  # tag's body — `/release` writes that text once and puts it in both places, so the repo
  # and the release page cannot drift. Header is rendered by the release pipe
  # (internal/pipe/release/body.go), which is why it survives `changelog.disable` below.
  #
  # The tag must be created with `git tag -a --cleanup=verbatim`: git's default cleanup
  # deletes every line starting with `#`, which strips the `### Added` headings out of the
  # tag object without a word, and this template would then publish a headingless body.
  header: |
    {{ .TagBody }}

builds:
  - main: ./cmd/den
    binary: den
    env:
      # den shells out to sbx and git; nothing links C. CGO off keeps the
      # binaries static and lets darwin/linux cross-compile from one runner.
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/PillowPillow/den/internal/cli.Version={{ .Tag }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  # No generated commit list: the release body is the hand-written section from
  # CHANGELOG.md, reaching GitHub through `release.header` above. A reformatted `git log`
  # underneath it would repeat the same release twice, in the worse of the two voices.
  #
  # `disable: true` and not `filters.exclude: [".*"]`, which was the first attempt:
  # excluding everything still leaves goreleaser's "## Changelog" title in the body, a
  # heading with nothing under it. Disabling skips the pipe entirely and leaves
  # ctx.ReleaseNotes empty, and the release pipe renders the header regardless — so the
  # body is exactly the tag body, nothing appended.
  disable: true

# homebrew_casks, not the deprecated `brews`: goreleaser v2 routes CLI binaries
# through casks now. The generated cask is NOT macOS-only, whatever the Homebrew
# folklore says: goreleaser emits an `on_linux do ... end` block pointing at
# den_<v>_linux_<arch>.tar.gz beside the darwin one, and Linuxbrew installs it
# (observed 2026-08-17 on a colleague's box, cask v1.8.0). Everything below that
# reaches for a macOS-only tool must therefore say so out loud — see the
# `postflight_steps` block. Linux users without brew still have the release archives,
# `install.sh` or `go install`; all of them answer `den version` correctly since
# the ldflags/buildinfo arbitration in internal/cli/version.go.
homebrew_casks:
  - name: den
    repository:
      owner: PillowPillow
      name: homebrew-tap
      # The Actions-provided GITHUB_TOKEN cannot push to another repository, so
      # the cask bump needs a PAT with write access to homebrew-tap, stored as
      # the TAP_GITHUB_TOKEN secret. Without it a release still publishes
      # archives — only the cask bump fails.
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/PillowPillow/den
    description: "Spawn and drive sbx microVM sandboxes for multi-project dev environments"
    # Same reason as the release block above: without an explicit template the
    # cask URLs follow the forge goreleaser guessed from ambient tokens.
    url:
      template: "https://github.com/PillowPillow/den/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    # The binaries are not notarized: without stripping the quarantine
    # attribute Gatekeeper blocks the first run with "cannot be opened".
    #
    # A hand-written `postflight_steps` stanza, NOT `hooks.post.install`:
    # Homebrew 7.x deprecated the Ruby `postflight` block that hook emits, and
    # every `brew upgrade` printed a warning sending users to the tap — where a
    # fix is overwritten by the next release. goreleaser's own replacement,
    # `hooks.post.install_steps`, is not in v2.18.3 (`goreleaser check`
    # refuses it as an unknown field); once a stable release carries it, move
    # this block there, where goreleaser's `.StagedPath` replaces the escape.
    #
    # The escape: Homebrew's step tokens (`{{staged_path}}`) use goreleaser's
    # own template delimiters, so written bare they are rendered by goreleaser
    # and never reach brew.
    #
    # `on_macos` is a step guard evaluated by brew's step runner, so the Linux
    # failure v1.8.0 shipped — a guard that itself ran /usr/bin/xattr and
    # raised on Linuxbrew, purging the cask — cannot recur: on Linux the `run`
    # step is never executed. It needs no `writable_paths` either: the step
    # sandbox already allows writes under the cask's caskroom_path, and the
    # staged binary lives there.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/den"]
        end
      end
    commit_author:
      name: goreleaser-bot
      email: bot@goreleaser.com
